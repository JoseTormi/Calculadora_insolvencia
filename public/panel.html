<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel de Leads | Avanzar</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-7xl px-4 py-6">
      <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <p class="text-sm font-semibold uppercase text-emerald-700">Alianza Juridica Avanzar</p>
          <h1 class="text-3xl font-bold text-blue-950">Panel interno</h1>
        </div>
        <button id="exportar" class="hidden rounded-md bg-emerald-700 px-4 py-2 font-semibold text-white">Exportar CSV</button>
      </header>

      <section id="login" class="max-w-md rounded-lg bg-white p-5 shadow-sm">
        <form id="login-form" class="space-y-4">
          <input class="w-full rounded-md border p-3" name="correo" type="email" placeholder="Correo" required />
          <input class="w-full rounded-md border p-3" name="password" type="password" placeholder="Contrasena" required />
          <button class="w-full rounded-md bg-blue-950 px-4 py-3 font-semibold text-white" type="submit">Ingresar</button>
          <p id="login-msg" class="text-sm text-red-700"></p>
        </form>
      </section>

      <section id="panel" class="hidden space-y-4">
        <form id="filtros" class="grid gap-3 rounded-lg bg-white p-4 shadow-sm md:grid-cols-6">
          <input class="rounded-md border p-2" name="fecha_desde" type="date" />
          <input class="rounded-md border p-2" name="fecha_hasta" type="date" />
          <input class="rounded-md border p-2" name="ciudad" placeholder="Ciudad" />
          <select class="rounded-md border p-2" name="estado">
            <option value="">Estado</option>
            <option value="nuevo">Nuevo</option>
            <option value="contactado">Contactado</option>
            <option value="no_contactado">No contactado</option>
          </select>
          <select class="rounded-md border p-2" name="servicio_recomendado">
            <option value="">Servicio</option>
            <option value="insolvencia">Insolvencia</option>
            <option value="rch">RCH</option>
            <option value="reorganizacion">Reorganizacion</option>
          </select>
          <button class="rounded-md bg-blue-950 px-4 py-2 font-semibold text-white" type="submit">Filtrar</button>
        </form>
        <div class="overflow-x-auto rounded-lg bg-white shadow-sm">
          <table class="min-w-full text-sm">
            <thead class="bg-slate-200 text-left">
              <tr>
                <th class="p-3">Fecha</th><th class="p-3">Nombre</th><th class="p-3">Ciudad</th><th class="p-3">Deuda</th><th class="p-3">Resultado</th><th class="p-3">Servicio</th><th class="p-3">Estado</th>
              </tr>
            </thead>
            <tbody id="leads"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/panel.js"></script>
  </body>
</html>
